<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votes du conseil municipal</title>
<link rel="icon" type="image/png" href="/logo_thue_et_mue.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="locked">
<div id="login" class="login">
  <form class="login-box" data-submit="login">
    <div class="row spread">
      <div class="brand">
        <img src="/rf_logo.svg" data-light-src="/rf_logo.svg" data-dark-src="/rf_logo_dark.svg" alt="République française" class="logo-rf">
        <img src="/logo_thue_et_mue.svg" data-light-src="/logo_thue_et_mue.svg" data-dark-src="/logo_thue_et_mue_dark.svg" alt="Thue et Mue" class="logo">
      </div>
      <div class="lang">
        <button type="button" data-act="lang" data-val="fr" lang="fr" title="Français">FR</button>
        <button type="button" data-act="lang" data-val="en" lang="en" title="English">EN</button>
      </div>
    </div>
    <h1 data-i18n="appTitle">Votes du conseil municipal</h1>
    <label for="email" data-i18n="loginEmail">Adresse e-mail</label>
    <input type="email" id="email" name="email" autocomplete="username" required autofocus>
    <label for="password" data-i18n="loginPassword">Mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <p class="login-error" id="login-error" role="alert"></p>
    <button class="b primary lg" data-i18n="loginBtn">Se connecter</button>
  </form>
</div>

<header class="header">
  <div class="wrap header-body">
    <div class="brand">
      <img src="/rf_logo.svg" data-light-src="/rf_logo.svg" data-dark-src="/rf_logo_dark.svg" alt="République française" class="logo-rf">
      <img src="/logo_thue_et_mue.svg" data-light-src="/logo_thue_et_mue.svg" data-dark-src="/logo_thue_et_mue_dark.svg" alt="Thue et Mue" class="logo">
      <div class="service">
        <p class="service-title" data-i18n="appTitle">Votes du conseil municipal</p>
        <p class="service-tagline" id="subtitle"></p>
      </div>
    </div>
    <div class="tools">
      <button class="b tertiary" type="button" data-act="themeToggle" id="theme-toggle"></button>
      <button class="b tertiary" data-act="logout" data-i18n="logout">Se déconnecter</button>
      <div class="lang">
        <button type="button" data-act="lang" data-val="fr" lang="fr" title="Français">FR</button>
        <button type="button" data-act="lang" data-val="en" lang="en" title="English">EN</button>
      </div>
    </div>
  </div>
  <nav class="nav">
    <div class="wrap">
      <div class="tabs">
        <button data-act="tab" data-val="presence" data-i18n="tabPresence">Séance &amp; présences</button>
        <button data-act="tab" data-val="votes" data-i18n="tabVotes">Votes</button>
        <button data-act="tab" data-val="confidential" data-i18n="tabConfidential">Votes confidentiels</button>
        <button data-act="tab" data-val="elus" data-i18n="tabElus">Liste des élus</button>
        <button data-act="tab" data-val="history" data-i18n="tabHistory">Historique</button>
      </div>
      <div class="actions">
        <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
        <button class="b primary" data-act="exportCSV" data-i18n="export">Exporter les résultats (CSV)</button>
        <button class="b" data-act="exportJSON" data-i18n="exportJSON">Exporter en JSON</button>
      </div>
    </div>
  </nav>
</header>

<main class="wrap">
  <section id="presence"></section>
  <section id="votes" class="hidden"></section>
  <section id="confidential" class="hidden"></section>
  <section id="elus" class="hidden"></section>
  <section id="history" class="hidden"></section>
</main>

<dialog id="mandate-dialog" aria-labelledby="mandate-dialog-title">
  <form class="mandate-form" data-submit="saveMandate">
    <h2 id="mandate-dialog-title"></h2>
    <p id="mandate-dialog-description" class="note"></p>
    <div class="grid">
      <label><span data-i18n="mandateStartYear">Année de début</span>
        <input name="startYear" type="number" min="1900" max="9999" step="1" required>
      </label>
      <label><span data-i18n="mandateEndYear">Année de fin</span>
        <input name="endYear" type="number" min="1900" max="9999" step="1" required>
      </label>
    </div>
    <div class="row mandate-actions">
      <button class="b" type="button" data-act="editCurrentMandate" data-i18n="editCurrentMandate">Modifier le mandat actuel</button>
      <button class="b" type="button" data-act="newMandate" data-i18n="createNewMandate">Créer un nouveau mandat</button>
      <button class="b primary" id="save-mandate" type="submit"></button>
      <button class="b" type="button" data-act="closeMandateDialog" data-i18n="cancel">Annuler</button>
    </div>
  </form>
</dialog>

<dialog id="reauth-dialog" aria-labelledby="reauth-dialog-title">
  <form class="mandate-form" data-submit="reauth">
    <h2 id="reauth-dialog-title" data-i18n="reauthTitle">Confirmez votre identité</h2>
    <p class="note" data-i18n="reauthDescription">La suppression d'une séance ou d'un vote demande de saisir à nouveau votre mot de passe.</p>
    <label for="reauth-password" data-i18n="loginPassword">Mot de passe</label>
    <input type="password" id="reauth-password" name="password" autocomplete="current-password" maxlength="72" required>
    <p id="reauth-error" class="login-error" role="alert"></p>
    <div class="row mandate-actions">
      <button class="b primary" type="submit" data-i18n="reauthConfirm">Confirmer</button>
      <button class="b" type="button" data-act="closeReauthDialog" data-i18n="cancel">Annuler</button>
    </div>
  </form>
</dialog>

<div id="notification" class="notification" role="status" aria-live="polite"></div>

<footer class="footer">
  <div class="wrap" data-i18n="footer">Commune de Thue et Mue · Registre des votes du conseil municipal</div>
</footer>

<!-- L'ordre des scripts compte : chaque fichier utilise ceux chargés avant lui -->
<script src="/js/i18n.js"></script>
<script src="/js/data.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/state.js"></script>
<script src="/js/votes.js"></script>
<script src="/js/render.js"></script>
<script src="/js/actions.js"></script>
<script src="/js/export.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
