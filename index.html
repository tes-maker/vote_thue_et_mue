<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votes du conseil municipal</title>
<link rel="icon" type="image/png" href="logo_thue_et_mue.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<div id="login" class="login">
  <form class="login-box" data-submit="login">
    <div class="row spread">
      <div class="brand">
        <img src="logo_eu.png" alt="Union européenne" class="logo-eu">
        <img src="rf_logo.svg" alt="République française" class="logo-rf">
        <img src="logo_thue_et_mue.svg" alt="Thue et Mue" class="logo">
      </div>
      <div class="lang">
        <button type="button" data-act="lang" data-val="fr" lang="fr" title="Français">FR</button>
        <button type="button" data-act="lang" data-val="en" lang="en" title="English">EN</button>
      </div>
    </div>
    <h1 data-i18n="appTitle">Votes du conseil municipal</h1>
    <label for="cle" data-i18n="loginLabel">Clé de connexion</label>
    <input type="password" id="cle" name="cle" autocomplete="current-password" required autofocus>
    <p class="login-error" id="login-error" role="alert"></p>
    <button class="b primary lg" data-i18n="loginBtn">Se connecter</button>
  </form>
</div>

<header class="header">
  <div class="wrap header-body">
    <div class="brand">
      <img src="logo_eu.png" alt="Union européenne" class="logo-eu">
      <img src="rf_logo.svg" alt="République française" class="logo-rf">
      <img src="logo_thue_et_mue.svg" alt="Thue et Mue" class="logo">
      <div class="service">
        <p class="service-title" data-i18n="appTitle">Votes du conseil municipal</p>
        <p class="service-tagline" id="subtitle"></p>
      </div>
    </div>
    <div class="tools">
      <button class="b tertiary" data-act="logout" data-i18n="logout">Se déconnecter</button>
      <div class="lang">
        <button type="button" data-act="lang" data-val="fr" lang="fr" title="Français">FR</button>
        <button type="button" data-act="lang" data-val="en" lang="en" title="English">EN</button>
      </div>
    </div>
  </div>
  <nav class="nav">
    <div class="wrap">
      <div class="tabs">
        <button data-act="tab" data-val="presence" data-i18n="tabPresence">Séance &amp; présences</button>
        <button data-act="tab" data-val="votes" data-i18n="tabVotes">Votes</button>
        <button data-act="tab" data-val="elus" data-i18n="tabElus">Liste des élus</button>
      </div>
      <div class="actions">
        <button class="b" data-act="openFile" data-i18n="open">Ouvrir</button>
        <button class="b" data-act="saveJSON" data-i18n="save">Sauvegarder</button>
        <button class="b primary" data-act="exportCSV" data-i18n="export">Exporter les résultats (CSV)</button>
        <input type="file" id="file" accept=".json" class="hidden" data-change="file">
      </div>
    </div>
  </nav>
</header>

<main class="wrap">
  <section id="presence"></section>
  <section id="votes" class="hidden"></section>
  <section id="elus" class="hidden"></section>
</main>

<footer class="footer">
  <div class="wrap" data-i18n="footer">Commune de Thue et Mue · Registre des votes du conseil municipal</div>
</footer>

<!-- L'ordre des scripts compte : chaque fichier utilise ceux chargés avant lui -->
<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/votes.js"></script>
<script src="js/render.js"></script>
<script src="js/actions.js"></script>
<script src="js/export.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
